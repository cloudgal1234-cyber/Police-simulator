[/Script/Engine.InputSettings]
; Classic (legacy) input mappings: work with keyboard/mouse, Xbox controllers and
; XInput steering wheels (Logitech G920/G923 Xbox, Thrustmaster TMX/T248 Xbox ...).
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.05,Sensitivity=1.f,Exponent=1.f,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_LeftY",AxisProperties=(DeadZone=0.2,Sensitivity=1.f,Exponent=1.f,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightX",AxisProperties=(DeadZone=0.15,Sensitivity=1.f,Exponent=1.f,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.15,Sensitivity=1.f,Exponent=1.f,bInvert=False))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Sensitivity=0.07f,Exponent=1.f,bInvert=False))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Sensitivity=0.07f,Exponent=1.f,bInvert=False))

; ---- driving
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=Up)
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=Gamepad_RightTriggerAxis)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=S)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=Down)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=Gamepad_LeftTriggerAxis)
+AxisMappings=(AxisName="Steer",Scale=1.0,Key=D)
+AxisMappings=(AxisName="Steer",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="Steer",Scale=1.0,Key=Right)
+AxisMappings=(AxisName="Steer",Scale=-1.0,Key=Left)
+AxisMappings=(AxisName="Steer",Scale=1.0,Key=Gamepad_LeftX)
; ---- on foot
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=Up)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=Down)
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=Gamepad_LeftX)
+AxisMappings=(AxisName="Turn",Scale=1.0,Key=MouseX)
+AxisMappings=(AxisName="TurnRate",Scale=1.0,Key=Gamepad_RightX)
+AxisMappings=(AxisName="TurnRate",Scale=0.8,Key=Right)
+AxisMappings=(AxisName="TurnRate",Scale=-0.8,Key=Left)
+AxisMappings=(AxisName="LookUp",Scale=-1.0,Key=MouseY)
+AxisMappings=(AxisName="LookUpRate",Scale=-1.0,Key=Gamepad_RightY)

